resources:
  schemas:
    bronze:
      name: bronze
      catalog_name: ${var.catalog}
      comment: Camada de chegada dos dados brutos antes das transformações.
    silver:
      name: silver
      catalog_name: ${var.catalog}
      comment: Camada de dados tratados e conformados para análise.
    gold:
      name: gold
      catalog_name: ${var.catalog}
