# This is a Declarative Automation Bundle definition for rotaperfume.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: rotaperfume
  uuid: f8b4c06a-6acc-4f20-97a5-df3d84a1a712

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity Catalog catalog used by the project
    default: lakehouse_rotaperfume
  warehouse_id:
    description: SQL Warehouse used by the pipeline
    default: 9fc0413fdd10b1fc

targets:
  dev:
    # Do not use mode: development: it prefixes Unity Catalog schema names.
    # Pause the schedule explicitly while keeping stable resource names.
    default: true
    workspace:
      host: https://dbc-f89f8724-9788.cloud.databricks.com
      profile: Matheus
    presets:
      trigger_pause_status: PAUSED
  prod:
    mode: production
    workspace:
      host: https://dbc-f89f8724-9788.cloud.databricks.com
      profile: Matheus
      # We explicitly deploy to /Workspace/Users/gody_nes@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gody_nes@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: gody_nes@hotmail.com
        level: CAN_MANAGE
